name: Publish release

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish release from tagged notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/contents/docs/releases/$GITHUB_REF_NAME.md?ref=$GITHUB_SHA" \
            --jq '.content' | base64 --decode > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Plex $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
