# OpenAI model profiles
host = "codex"
# Basic shares settings; other tiers explicitly configure each team role.

# ==================== Basic ====================

[profiles.basic]
  model     = "gpt-6-luna"
  reasoning = "high"

  # ==================== Plus ====================

[profiles.plus.pm]
  model     = "gpt-6.1-sol"
  reasoning = "low"

[profiles.plus.dev]
  model     = "gpt-6-luna"
  reasoning = "max"

[profiles.plus.reviewer]
  model     = "gpt-6.1-sol"
  reasoning = "medium"


[profiles.plus.explorer]
  model     = "gpt-6-luna"
  reasoning = "high"

[profiles.plus.researcher]
  model     = "gpt-6.1-sol"
  reasoning = "low"

[profiles.plus.qa]
  model     = "gpt-6-luna"
  reasoning = "high"

  # ==================== Pro ====================

[profiles.pro.pm]
  model     = "gpt-6.1-sol"
  reasoning = "medium"

[profiles.pro.dev]
  model     = "gpt-6-luna"
  reasoning = "max"

[profiles.pro.reviewer]
  model     = "gpt-6.1-sol"
  reasoning = "high"


[profiles.pro.explorer]
  model     = "gpt-6-luna"
  reasoning = "high"

[profiles.pro.researcher]
  model     = "gpt-6.1-sol"
  reasoning = "medium"

[profiles.pro.qa]
  model     = "gpt-6-luna"
  reasoning = "max"

  # ==================== Pro+ ====================

[profiles.pro-plus.pm]
  model     = "gpt-6.1-sol"
  reasoning = "medium"

[profiles.pro-plus.dev]
  model     = "gpt-6.1-sol"
  reasoning = "high"

[profiles.pro-plus.reviewer]
  model     = "gpt-6-astra"
  reasoning = "medium"

[profiles.pro-plus.explorer]
  model     = "gpt-6.1-sol"
  reasoning = "low"

[profiles.pro-plus.researcher]
  model     = "gpt-6.1-sol"
  reasoning = "medium"

[profiles.pro-plus.qa]
  model     = "gpt-6.1-sol"
  reasoning = "high"

# Main-chat recommendations only; never applied to client settings.

[coordinator.basic]
model = "gpt-6-luna"
reasoning = "high"

[coordinator.plus]
model = "gpt-6.1-sol"
