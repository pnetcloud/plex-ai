# OpenAI model profiles
host = "codex"
# Coordinator settings are main-chat recommendations only; never applied.
# Basic shares defaults; other tiers configure each role.

# ==================== Basic ====================

[coordinator.basic]
  model     = "gpt-6-luna"
  reasoning = "high"

[profiles.basic]
  model     = "gpt-6-luna"
  reasoning = "high"


# ==================== Plus ====================

[coordinator.plus]
  model     = "gpt-6-luna"
  reasoning = "xhigh"

[profiles.plus.pm]
  model     = "gpt-6.1-sol"
  reasoning = "low"

[profiles.plus.explorer]
  model     = "gpt-6-luna"
  reasoning = "high"

[profiles.plus.researcher]
  model     = "gpt-6.1-sol"
  reasoning = "low"

[profiles.plus.dev]
  model     = "gpt-6-luna"
  reasoning = "xhigh"

[profiles.plus.reviewer]
  model     = "gpt-6.1-sol"
  reasoning = "medium"

[profiles.plus.qa]
  model     = "gpt-6-luna"
  reasoning = "high"


