# Google model profiles for Antigravity
# Flash handles lightweight work; inherit uses the main chat model.
# Select a strong Gemini main-chat model for Pro+ and higher.
# Ultra tiers increase requested effort; inherit does not select another model.
host = "antigravity"
# Coordinator settings are main-chat recommendations only; never applied.
# Basic shares defaults; other tiers configure each role.

# ==================== Basic ====================

[coordinator.basic]
  model     = "flash"
  reasoning = "high"

[profiles.basic]
  model     = "flash"
  reasoning = "high"


# ==================== Plus ====================

[coordinator.plus]
  model     = "flash"
  reasoning = "xhigh"

[profiles.plus.pm]
  model     = "inherit"
  reasoning = "low"

[profiles.plus.explorer]
  model     = "flash"
  reasoning = "high"

[profiles.plus.researcher]
  model     = "inherit"
  reasoning = "low"

[profiles.plus.dev]
  model     = "flash"
  reasoning = "xhigh"

[profiles.plus.reviewer]
  model     = "inherit"
  reasoning = "medium"

[profiles.plus.qa]
  model     = "flash"
  reasoning = "high"


# ==================== Pro ====================

[coordinator.pro]
  model     = "flash"
