# Anthropic model profiles
host = "claude"
# Basic shares defaults with a reviewer override; other tiers configure each role.

# ==================== Basic ====================

[profiles.basic]
  model     = "haiku"
  reasoning = "high"

# Basic review has an explicit role setting independent of implementation defaults.
[profiles.basic.reviewer]
  model     = "sonnet"
  reasoning = "medium"

  # ==================== Plus ====================

[profiles.plus.analyst]
  model     = "sonnet"
  reasoning = "low"

[profiles.plus.pm]
  model     = "sonnet"
  reasoning = "medium"

[profiles.plus.ux]
  model     = "haiku"
  reasoning = "max"

[profiles.plus.architect]
  model     = "sonnet"
  reasoning = "medium"

[profiles.plus.dev]
