# OpenAI model profiles
host = "codex"
# Coordinator settings are main-chat recommendations only; never applied.
# Basic shares defaults with a reviewer override; other tiers configure each role.

# ==================== Basic ====================

[coordinator.basic]
  model     = "gpt-6-luna"
  reasoning = "high"

[profiles.basic]
  model     = "gpt-6-luna"
  reasoning = "high"

  [profiles.basic.reviewer]
    model     = "gpt-6.1-sol"
    reasoning = "medium"


    # ==================== Plus ====================

[coordinator.plus]
  model     = "gpt-6-luna"
