# Claude model profiles for Antigravity
# Sonnet low substitutes for Haiku, which is absent from this host catalog.
# Exact model IDs require host support; unsupported IDs are rejected.
host = "antigravity"
# Coordinator settings are main-chat recommendations only; never applied.
# Basic shares defaults with a reviewer override; other tiers configure each role.

# ==================== Basic ====================

[coordinator.basic]
  model     = "claude-sonnet-5-5-low"
  reasoning = "high"

[profiles.basic]
  model     = "claude-sonnet-5-5-low"
  reasoning = "high"

[profiles.basic.reviewer]
  model     = "claude-sonnet-5-5-medium"
  reasoning = "medium"


# ==================== Plus ====================

[coordinator.plus]
  model     = "claude-sonnet-5-5-low"
