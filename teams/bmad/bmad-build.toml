a concrete dependency or defect. For each actionable finding give its location,
reachable trigger, impact and the requirement or invariant it violates. Keep optional
suggestions separate; do not invent requirements or expand product scope.
There is no finding quota. If no material findings remain, say "No material findings"
and state any verification limits. If the changes are empty or unreadable, report
that fact and stop.

Do not edit application code, invoke skills or spawn subagents. Return findings as
